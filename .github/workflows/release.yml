name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только собрать и приложить архив к запуску, без тега и релиза'
        type: boolean
        default: false
      prerelease:
        description: 'Пометить релиз как предварительный'
        type: boolean
        default: false

# Нужно и для push обновлённого VersionInfo.cs, и для создания тега и релиза.
permissions:
  contents: write

env:
  # Формат последнего тега репозитория - v.0.5.2609.8100.
  TAG_PREFIX: 'v.'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # нужны теги, чтобы поймать повторный выпуск той же версии

      - uses: microsoft/setup-msbuild@v2

      - name: Собрать и упаковать
        id: pack
        shell: pwsh
        run: '& .github/script/Release.ps1'

      - uses: actions/upload-artifact@v7
        with:
          name: enviriot-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.zip }}

      - name: Проверить, что тег свободен
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          TAG: ${{ env.TAG_PREFIX }}${{ steps.pack.outputs.version }}
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote завершился с ошибкой' }
          if ($existing) {
            throw "Тег $env:TAG уже существует - эта версия выпущена. Соберите заново, чтобы получить следующий номер."
          }

      # UpdateVersionInfo переписывает VersionInfo.cs при каждой сборке; без возврата
      # изменения в ветку следующий прогон в тот же день получил бы тот же номер.
      - name: Зафиксировать VersionInfo.cs
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Server/Properties/VersionInfo.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'VersionInfo.cs не изменился, коммит не нужен.'
          } else {
            git commit -m "Version $env:VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'git commit завершился с ошибкой' }
            git push origin "HEAD:$env:BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'git push завершился с ошибкой' }
          }

      - name: Создать релиз
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG_PREFIX }}${{ steps.pack.outputs.version }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $sha = git rev-parse HEAD
          $ghArgs = @(
            'release', 'create', $env:TAG, $env:ZIP,
            '--title', "Enviriot $env:VERSION",
            '--generate-notes',
            '--target', $sha
          )
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create завершился с ошибкой' }
