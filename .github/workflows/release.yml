name: Release

# Выпуск: полная пересборка Release, архив, тег и релиз. Только по кнопке.
# Проверка коммитов - отдельный workflow (ci.yml): там Debug и тесты. Оба вызывают
# один и тот же .github/script/Build.ps1, разными режимами.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только собрать и приложить архив к запуску, без тега и релиза'
        type: boolean
        default: false
      prerelease:
        description: 'Пометить релиз как предварительный'
        type: boolean
        default: false

# Нужно для создания тега и релиза. Ветку workflow больше не трогает: номер выпуска считается
# от последнего тега, и коммитить в репозиторий нечего.
permissions:
  contents: write

env:
  # Формат последнего тега репозитория - v.0.5.2609.8100.
  TAG_PREFIX: 'v.'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # нужны теги: из них Build.ps1 считает номер выпуска

      # microsoft/setup-msbuild не нужен - Build.ps1 находит MSBuild через vswhere сам, см. ci.yml.
      - name: Собрать Release и упаковать
        id: pack
        shell: pwsh
        run: '& .github/script/Build.ps1 -Mode Pack'

      - uses: actions/upload-artifact@v7
        with:
          name: enviriot-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.zip }}

      # Номер выводится от последнего тега, поэтому новый свободен по построению. Проверка
      # осталась как защита от второго выпуска, запущенного одновременно с этим.
      - name: Проверить, что тег свободен
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          TAG: ${{ env.TAG_PREFIX }}${{ steps.pack.outputs.version }}
        run: |
          $existing = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw 'git ls-remote завершился с ошибкой' }
          if ($existing) {
            throw "Тег $env:TAG уже существует - похоже, выпуск запущен дважды одновременно."
          }

      - name: Создать релиз
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG_PREFIX }}${{ steps.pack.outputs.version }}
          VERSION: ${{ steps.pack.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $sha = git rev-parse HEAD
          $ghArgs = @(
            'release', 'create', $env:TAG, $env:ZIP,
            '--title', "Enviriot $env:VERSION",
            '--generate-notes',
            '--target', $sha
          )
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw 'gh release create завершился с ошибкой' }
